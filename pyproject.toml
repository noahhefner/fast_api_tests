[project]
name = "fast-api-tests"
version = "0.1.0"
description = "FastAPI Project Repository Example"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "pyclean>=3.7.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "uv-upsync>=2.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
